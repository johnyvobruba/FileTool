# Sestaví FileTool a při nové verzi (VERSION v build-app.sh) automaticky vydá GitHub Release.
# Aplikace si release najde (Nastavení → O aplikaci / menu Zkontrolovat aktualizace) a ověří podpis.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}           # oprávnění jen na úrovni jobu (nejmenší nutná)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write        # tag a release (vestavěný GITHUB_TOKEN, žádný osobní token)
      id-token: write        # podepsaná provenance buildu (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Xcode (nejnovější stabilní)
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Verze
        id: v
        run: |
          VERSION=$(sed -nE 's/^VERSION="\$\{VERSION_OVERRIDE:-([0-9.]+)\}"/\1/p' build-app.sh)
          [ -n "$VERSION" ] || { echo "Verze nenalezena v build-app.sh"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
          echo "Verze $VERSION"


      - name: Build
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: bash ./build-app.sh       # bash explicitně – nezávisí na příznaku spustitelnosti v gitu

      - name: Balíček a podpis
        if: steps.v.outputs.release == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          V=${{ steps.v.outputs.version }}
          ditto -c -k --keepParent build/FileTool.app "FileTool-$V.zip"
          shasum -a 256 "FileTool-$V.zip" | tee "FileTool-$V.zip.sha256"
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            swift scripts/sign-update.swift "FileTool-$V.zip"
          else
            echo "::warning::Chybí secret UPDATE_SIGNING_KEY – release bude bez podpisu a aplikace ho nenainstaluje automaticky."
          fi

      - name: Poznámky k vydání z CHANGELOG.md
        if: steps.v.outputs.release == 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          awk -v v="## $V" 'index($0, v)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "FileTool $V" > notes.md
          cat notes.md

      - name: SBOM (seznam přibalených závislostí)
        if: steps.v.outputs.release == 'true'
        run: |
          V=${{ steps.v.outputs.version }}
          python3 scripts/sbom.py FileTool "$V" > "FileTool-$V.sbom.json"
          cat "FileTool-$V.sbom.json"

      - name: Provenance buildu (Sigstore attestace)
        if: steps.v.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        continue-on-error: true    # bez attestace se release vydá i tak
        with:
          subject-path: |
            FileTool-${{ steps.v.outputs.version }}.zip
            FileTool-${{ steps.v.outputs.version }}.sbom.json

      - name: GitHub Release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          FILES="FileTool-$V.zip FileTool-$V.zip.sha256 FileTool-$V.sbom.json"
          [ -f "FileTool-$V.zip.sig" ] && FILES="$FILES FileTool-$V.zip.sig"
          gh release create "v$V" $FILES --title "FileTool $V" --notes-file notes.md --target "$GITHUB_SHA"
